sources:
  - name: silver
    meta:
      external_location: "read_parquet('{{ env_var('GHLAKE_DATA', 'data') }}/silver/*/*/*.parquet', hive_partitioning = true)"
    tables:
      - name: events
        config:
          loaded_at_field: created_at
          freshness:
            error_after: {count: 3, period: hour}
