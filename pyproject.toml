[project]
name = "ghlake"
version = "0.1.0"
description = "Hourly lakehouse over GH Archive"
requires-python = ">=3.11,<3.12"
dependencies = [
    "duckdb>=1.3",
    "dbt-duckdb>=1.9",
    "huggingface_hub>=0.30",
    "requests>=2.32",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.uv]
package = false

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
pythonpath = ["."]
